<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" style="max-width:100%;height:auto;display:block">
  <rect width="1200" height="630" fill="#06060a"/>

  <!-- Red glow -->
  <radialGradient id="rg" cx="25%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#rg)"/>

  <!-- Blue glow -->
  <radialGradient id="bg" cx="75%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- RED -->
  <text x="300" y="360" font-family="system-ui, sans-serif" font-size="200" font-weight="900" fill="#dc2626" text-anchor="middle" textLength="480" lengthAdjust="spacingAndGlyphs">RED</text>

  <!-- or -->
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="80" font-weight="400" fill="#7070a0" text-anchor="middle">or</text>

  <!-- BLUE -->
  <text x="900" y="360" font-family="system-ui, sans-serif" font-size="200" font-weight="900" fill="#3b82f6" text-anchor="middle" textLength="480" lengthAdjust="spacingAndGlyphs">BLUE</text>

  <!-- Tagline -->
  <text x="600" y="440" font-family="system-ui, sans-serif" font-size="30" fill="#7070a0" text-anchor="middle" letter-spacing="2">One button. Everyone's fate.</text>

  <!-- Domain -->
  <text x="600" y="500" font-family="system-ui, sans-serif" font-size="22" fill="#3a3a5a" text-anchor="middle" letter-spacing="3">redor.blue</text>
</svg>
