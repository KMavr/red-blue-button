<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Radial gradient fill for red semicircle: bright center, darker edge -->
    <radialGradient id="red-fill" cx="70%" cy="50%" r="80%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
    <!-- Radial gradient fill for blue semicircle -->
    <radialGradient id="blue-fill" cx="30%" cy="50%" r="80%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#000000"/>

  <!-- Faint full-bleed red-to-blue gradient -->
  <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#dc2626" stop-opacity="0.5"/>
    <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.5"/>
  </linearGradient>
  <rect width="1200" height="630" fill="url(#bg-grad)"/>

  <!-- Red semicircle with radial gradient fill -->
  <path d="M 600 90 A 225 225 0 0 0 600 540 Z" fill="url(#red-fill)"/>
  <!-- Blue semicircle with radial gradient fill -->
  <path d="M 600 90 A 225 225 0 0 1 600 540 Z" fill="url(#blue-fill)"/>

  <!-- Dividing line -->
  <line x1="600" y1="90" x2="600" y2="540" stroke="#000000" stroke-width="3"/>

  <!-- RED label -->
  <text x="488" y="318" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">RED</text>
  <!-- BLUE label -->
  <text x="712" y="318" font-family="Arial Black, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle">BLUE</text>

  <!-- Domain -->
  <text x="600" y="595" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" dominant-baseline="middle" opacity="0.4" letter-spacing="5">redor.blue</text>
</svg>
